"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

# One line: os │ dir │ vcs (jj if present, else git) │ ─── fill ─── │ ▼ │ node │ time
format = """
[](bold white)$os\
$hostname\
[](bold cyan)$directory\
$vcs\
[](bold black)$fill\
$cmd_duration\
$status\
$jobs\
$buf\
$bun\
$c\
$cmake\
$cobol\
$cpp\
$crystal\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$golang\
$gradle\
$haskell\
$haxe\
$java\
$julia\
$kotlin\
$lua\
$maven\
$meson\
$nim\
$nodejs\
$ocaml\
$opa\
$perl\
$php\
$purescript\
$python\
$raku\
$red\
$rlang\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$vlang\
$xmake\
$zig\
$time\
$line_break\
$custom"""

# jj wins over git when the directory is a jj repo
[vcs]
order = ["jj", "git", "hg", "pijul", "fossil"]
git_modules = "$git_branch$git_commit$git_state$git_metrics$git_status"

[os]
disabled = false
style = "bold white"
format = "[$symbol]($style)"
[os.symbols]
Arch = "\uf303 "

[directory]
style = "bold cyan"
format = "[  $path]($style)  "
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = "\uf1d3 "
style = "bold green"
format = "[$symbol$branch]($style)  "

[git_commit]
format = "[@$hash]($style)  "
style = "bold yellow"
commit_hash_length = 7
only_detached = false

[jj_bookmark]
symbol = "\uf1d3 "
style = "bold green"
format = "[$symbol$bookmark]($style)  "

[jj_change]
format = "[@](bold yellow)$change  "
prefix_style = "bold yellow"
suffix_style = "bold yellow"
change_hash_length = 7

[fill]
symbol = "─"
style = "bold black"


[time]
disabled = false
time_format = "%H:%M:%S"
style = "bold white"
format = "[$time]($style)"


[buf]
format = "[$symbol$version]($style) "
version_format = "${raw}"

[bun]
format = "[$symbol$version]($style) "
version_format = "${raw}"

