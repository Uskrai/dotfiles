# classic shell indicator at the typing position: > for you, # for root
[custom.prompt_user]
when = 'test "$(id -u)" -ne 0'
command = "printf '>'"
format = "[$output]($style) "
style = "bold green"

[custom.prompt_root]
when = 'test "$(id -u)" -eq 0'
command = "printf '#'"
format = "[$output]($style) "
style = "bold red"

[status]
disabled = false
map_symbol = true
format = "[$symbol$status]($style) "
